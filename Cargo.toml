[package]
name = "pnl"
version = "0.6.0"
edition = "2024"

[lib]
path = "src/cli/lib.rs"
# `cdylib` exposes the C ABI in `ffi.rs` (schema validation) to the PHP runtime;
# `rlib` keeps the library usable by the pnl/pnlx binaries and tests.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "pnl"
path = "src/cli/bin/pnl.rs"

[[bin]]
name = "pnlx"
path = "src/cli/bin/pnlx.rs"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
clang = { version = "2.0.0", features = ["clang_10_0", "runtime"] }
clap = { version = "4.5.53", features = ["derive"] }
console = "0.16.3"
ed25519-dalek = "2.2.0"
flate2 = "1.1.9"
gethostname = "1.1.0"
git-url-parse = "0.6.0"
handlebars = "6.3.2"
include_dir = "0.7.4"
jsonschema = { version = "0.18", default-features = false, features = ["draft201909"] }
object = { version = "0.36", default-features = false, features = ["read", "std"] }
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
suppaftp = "8.0.4"
tar = "0.4.46"
ureq = "3.3.0"
url = "2.5.8"
yaml-rust2 = "0.10"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# git2 is split by target: on Unix we vendor OpenSSL + libgit2 for a
# self-contained binary; on Windows OpenSSL is painful to build, so we vendor
# only libgit2 and let it use the native WinHTTP transport for HTTPS.
[target.'cfg(not(target_os = "windows"))'.dependencies.git2]
version = "0.21.0"
default-features = false
features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"]

[target.'cfg(target_os = "windows")'.dependencies.git2]
version = "0.21.0"
default-features = false
# `cred` (no OpenSSL) keeps Cred::credential_helper available for HTTPS auth.
features = ["vendored-libgit2", "cred"]

[build-dependencies]
# Used by build.rs to turn config.toml into compile-time constants, rendered
# through a Handlebars template (no Rust code is assembled with string concat).
handlebars = "6.3.2"
serde_json = "1.0.145"
toml = "0.8.19"

[dev-dependencies]
insta = "1.47.2"
tempfile = "3.23.0"

# The `clang` crate's `SourceRange::tokenize` passes libclang's token buffer to
# `slice::from_raw_parts`; for a range that yields zero tokens libclang returns a
# null pointer with count 0, which trips Rust's debug-only unsafe-precondition
# (non-null) check and aborts (a crate bug). Some real headers (brotli's
# encode.h/decode.h) hit this. Release builds skip the check; disabling debug
# assertions for just this dependency makes debug builds and `cargo test` behave
# the same, so parsing those headers no longer crashes.
[profile.dev.package.clang]
debug-assertions = false
