# Built-in configuration for the pnl/pnlx binaries.
#
# `build.rs` reads this file at build time and turns it into compile-time
# constants (under `crate::config`), so the values are baked into the binary —
# nothing here is read from disk at runtime.
#
# The repository endpoints can additionally be overridden per project in
# `pnl.json` under a `config` block, e.g. when self-hosting a fork of pnl or a
# private package registry:
#
#   "config": {
#     "self_repository": "https://github.com/acme/pnl",
#     "packages_repository": "https://github.com/acme/pnl-packages/tree/main/packages"
#   }

# The config/lock/pathmap schema version. The schema files live under
# `schemas/<kind>/<schema_version>/`.
schema_version = "2026-07-01"

[repositories]
# Where pnl itself is released — used by the startup update check and
# `pnl self-upgrade`.
self = "https://github.com/m3m0r7/pnl"

# The default package registry consulted as the lowest-priority fallback when
# resolving a bare name (e.g. `pnl install libc`). It publishes a
# `repository-index.json` so `pnl find` can browse it without cloning.
packages = "https://github.com/m3m0r7/pnl-packages/tree/main/packages"

[workspace]
# Default directory (relative to the project root) for generated workspace
# files — the lock, pathmap, installed packages, and autoload.
output_dir = "@pnlx"

[update_check]
# How long a "latest release" lookup stays fresh before pnl re-checks remotely.
ttl_seconds = 3600
# Setting this environment variable (to any value) skips the startup update check.
opt_out_env = "PNL_NO_UPDATE_CHECK"
# Cache key for the latest-release lookup under the shared cache.
cache_key = "latest-release"

[binaries]
# The executables shipped by this package (installed/symlinked by self-upgrade).
names = ["pnl", "pnlx"]
