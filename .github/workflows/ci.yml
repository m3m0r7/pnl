name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Install libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  windows:
    name: Windows (release check)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}

      - name: Check release build
        run: cargo check --locked --release

  php:
    name: PHP (phpstan max, cs, phpunit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ffi
          ini-values: ffi.enable=1
          tools: composer

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-php-${{ hashFiles('Cargo.lock') }}

      - name: Build release binaries
        run: cargo build --locked --release --bins

      - name: Smoke test Composer CLI shims
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "pnl") | .version')"
          install -d "bin/.native/${package_version}"
          install -m 0755 target/release/pnl "bin/.native/${package_version}/pnl"
          install -m 0755 target/release/pnlx "bin/.native/${package_version}/pnlx"
          test "$(bin/pnl --version)" = "pnl ${package_version}"
          test "$(bin/pnlx --version)" = "pnlx ${package_version}"

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPStan (level max)
        run: composer analyse

      - name: PHP-CS-Fixer
        run: composer cs

      - name: Validate schemas (OpenAPI)
        run: composer validate:schemas

      - name: PHPUnit
        run: composer test
