name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          # Both macOS targets build on Apple Silicon runners (Intel runners are
          # scarce/queued); x86_64 is produced by cross-compiling.
          - name: macos-x86_64
            os: macos-14
            target: x86_64-apple-darwin
            archive: tar.gz
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Resolve package version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          echo "PNL_VERSION=${version}" >> "${GITHUB_ENV}"

      # Tests (which need libclang and build the heavy git2/OpenSSL deps twice)
      # run in ci.yml. This workflow only builds and packages the binaries, so
      # the native dependencies are compiled just once per target.
      - name: Build release binaries
        run: cargo build --locked --release --bins --target ${{ matrix.target }}

      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          package="pnl-${PNL_VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${package}"
          cp "target/${{ matrix.target }}/release/pnl" "dist/${package}/"
          cp "target/${{ matrix.target }}/release/pnlx" "dist/${package}/"
          cp README.md README.ja.md LICENSE "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $package = "pnl-${env:PNL_VERSION}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$package" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/pnl.exe" "dist/$package/"
          Copy-Item "target/${{ matrix.target }}/release/pnlx.exe" "dist/$package/"
          Copy-Item README.md, README.ja.md, LICENSE "dist/$package/"
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pnl-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          # The release job does not check out the repo, so point gh at it
          # explicitly (otherwise gh tries to infer it from a missing .git).
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          mapfile -t assets < <(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no release assets found" >&2
            exit 1
          fi

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${TAG_NAME}" "${assets[@]}" --title "${TAG_NAME}" --notes "Release ${TAG_NAME}"
          fi
